[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2.3.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Disk alanı ön kontrolü için tek küçük crate. fs2 2018'den beri bakımsız
# (son sürüm 0.4.3); fs4 onun bakımlı çatalıdır ve aynı API'yi sunar:
# `fs4::available_space(path) -> io::Result<u64>`. std'de Windows için karşılığı yok.
fs4 = "1"
tauri-plugin-single-instance = "2.4.4"

[profile.dev]
# Keep line-number backtraces without full debugger symbols.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
